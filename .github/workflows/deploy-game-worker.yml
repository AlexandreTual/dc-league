# Déploie le Worker de jeu en ligne (workers/game) et applique les migrations D1 à chaque fusion sur main.
# Secrets à créer une fois dans le dépôt : CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID
# (voir docs/deploiement-jeu-en-ligne.md).
name: Déployer le Worker de jeu

on:
  push:
    branches: [main]
    # Tout fichier importé par workers/game/index.ts doit figurer ici
    # (vérifié par workers/game/deploy-paths.test.ts).
    paths:
      - 'workers/**'
      - 'lib/game/**'
      - 'lib/games/**'
      - 'lib/db-games.ts'
      - 'lib/db-chunks.ts'
      - 'lib/db-errors.ts'
      - 'lib/db.ts'
      - 'lib/cards/types.ts'
      - 'migrations/**'
      - '.github/workflows/deploy-game-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-game-worker
  cancel-in-progress: false

# Les tests ont déjà tourné sur la pull request : ils ne sont pas relancés ici,
# pour appliquer les migrations le plus tôt possible (le site Pages se déploie
# en parallèle) et pour qu'un test qui casse après la fusion ne bloque pas la base.
jobs:
  migrations:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Pour la version de wrangler fixée par package-lock.json.
      - name: Installer les dépendances
        run: npm ci

      # Point de retour en arrière (docs/deploiement-jeu-en-ligne.md) : n'empêche jamais la migration.
      - name: Marque-page Time Travel avant migration
        continue-on-error: true
        run: npx wrangler d1 time-travel info dc-league

      - name: Migrations de la base D1
        run: npx wrangler d1 migrations apply dc-league --remote

  deploy:
    needs: migrations
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Déployer le Worker
        working-directory: workers/game
        run: npx wrangler deploy
